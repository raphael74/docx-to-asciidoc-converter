antora:
  extensions:
    - require: '@antora/lunr-extension'
      languages: [ en, de ]

site:
  title: Referenzarchitekturen
  start_page: referenzarchitekturen:ROOT:index.adoc

content:
  sources:
    - url: .
      start_path: antora
      branches: HEAD
      # The pages are generated by build-antora.js, so an "Edit this page"
      # link would point at a file that the next build overwrites.
      edit_url: false

ui:
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
  supplemental_files: ./supplemental-ui

asciidoc:
  attributes:
    idprefix: ''
    idseparator: '-'
    sectanchors: ''
    sectids: ''
    sectnums: ''
    # Asciidoctor supports 0-5; the generated pages go four levels deep.
    sectnumlevels: 5
    # The documents are German; use German labels for generated captions
    # instead of Asciidoctor's defaults ("Figure", "Table").
    table-caption: Tabelle
    # Asciidoctor numbers figures per page, restarting at 1 for each chapter
    # page (like `sectnums`). build-antora.js rewrites the body references to
    # those page-local numbers.
    figure-caption: Abbildung

runtime:
  log:
    # Fail the build on any Antora warning (duplicate IDs, "section title out
    # of sequence", unresolved xrefs, missing images, ...), so that
    # `yarn build` cannot succeed with warnings.
    failure_level: warn

output:
  dir: ./build/site
  # Remove the previous output first. Otherwise pages of renamed or removed
  # documents/chapters stay in build/site and verify-links.js would check
  # stale HTML.
  clean: true
