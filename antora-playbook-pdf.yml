# Playbook for the PDF export. It uses the same generated Antora modules as the
# HTML site (antora-playbook.yml), but instead of publishing a website it runs
# the Antora PDF extension, which assembles each document into a single AsciiDoc
# file and converts it with Asciidoctor PDF.
#
# Run `yarn pdf` (or `yarn split && yarn build:pdf`) after changing the DOCX
# files. The PDFs are written to build/pdf/.
site:
  title: Referenzarchitekturen
  start_page: referenzarchitekturen:ROOT:index.adoc

content:
  sources:
    - url: .
      start_path: antora
      branches: HEAD
      # See antora-playbook.yml: the pages are generated on every build.
      edit_url: false

ui:
  # The UI is not part of the PDF, but Antora still loads the bundle while
  # generating the site. Reusing the HTML playbook's bundle keeps both builds
  # on the same version.
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable

asciidoc:
  attributes:
    # Keep the IDs, numbering and German captions identical to the HTML site.
    idprefix: ''
    idseparator: '-'
    sectanchors: ''
    sectids: ''
    sectnums: ''
    sectnumlevels: 5
    table-caption: Tabelle
    figure-caption: Abbildung
    # Use the EJPD-styled theme in pdf-theme/ejpd-theme.yml. The themes
    # directory is resolved relative to the converter's working directory,
    # which is the project root (see asciidoctor-pdf-docker.sh).
    pdf-theme: ejpd
    pdf-themesdir: pdf-theme
    # Word numbers chapters as "1 Title" instead of Asciidoctor PDF's default
    # "Chapter 1. Title".
    chapter-signifier: ''
    # The generated landing page is used as the PDF preface. Word calls the
    # equivalent page "Inhaltsverzeichnis" rather than "Overview".
    assembly-overview-title: Inhaltsverzeichnis

antora:
  extensions:
    # The Assembler writes the title page date (revdate) as YYYY-MM-DD. This
    # local extension rewrites it to the DD.MM.YYYY format used on the Word
    # title pages before the Assembler creates the assemblies.
    - require: ./pdf-date-extension.js
    # Configuration (one PDF per document, Docker/local command) lives in
    # antora-assembler-pdf.yml next to this file.
    - require: '@antora/pdf-extension'

output:
  # The PDFs are generated into the Assembler build directory (build/pdf).
  # No HTML site is published: this playbook exists to produce the PDFs.
  destinations: []
  clean: true

runtime:
  log:
    # Fail on Antora warnings, like the HTML build.
    failure_level: warn
